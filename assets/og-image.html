<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: radial-gradient(ellipse 70% 90% at 85% 0%, #17304a 0%, #0b0f19 60%), #0b0f19;
    color: #e5e7eb; overflow: hidden; position: relative;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }
  .grid { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(#16202f 1px, transparent 1px), linear-gradient(90deg, #16202f 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 60% 80% at 80% 30%, #000 0%, transparent 75%);
  }
  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 34px; letter-spacing: .06em; color: #f8fafc; }
  .tag { margin-left: auto; font-size: 20px; color: #67e8f9; border: 1px solid #155e75; background: #0c2228; padding: 8px 18px; border-radius: 999px; font-weight: 600; }
  h1 { font-size: 70px; line-height: 1.07; letter-spacing: -.02em; font-weight: 800; color: #f8fafc; max-width: 900px; }
  h1 em { font-style: normal; color: #22d3ee; }
  .sub { margin-top: 26px; font-size: 29px; line-height: 1.4; color: #9aa4b2; max-width: 880px; }
  .foot { display: flex; align-items: center; gap: 14px; font-size: 22px; color: #8b95a7; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22d3ee; }
  .call { position: absolute; right: 72px; top: 150px; width: 250px; height: 250px; border-radius: 50%;
    border: 2px solid #164e63; display: flex; align-items: center; justify-content: center; }
  .call::before { content: ""; position: absolute; inset: -34px; border-radius: 50%; border: 2px solid #134357; opacity: .6; }
  .call::after { content: ""; position: absolute; inset: -68px; border-radius: 50%; border: 2px solid #112f40; opacity: .35; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="call">
  <svg width="120" height="120" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2.5l7.5 2.7v6.1c0 4.8-3.2 8.9-7.5 10.2-4.3-1.3-7.5-5.4-7.5-10.2V5.2L12 2.5z" fill="url(#g2)" stroke="#22d3ee" stroke-width="0.8"/>
    <path d="M7.2 12.4h2.3l1.3-2.6 1.6 4.8 1.2-2.2h2.3" stroke="#0b0f19" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <defs><linearGradient id="g2" x1="4.5" y1="2.5" x2="19.5" y2="21.5" gradientUnits="userSpaceOnUse"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2"/></linearGradient></defs>
  </svg>
</div>
<div class="wrap">
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2.5l7.5 2.7v6.1c0 4.8-3.2 8.9-7.5 10.2-4.3-1.3-7.5-5.4-7.5-10.2V5.2L12 2.5z" fill="url(#g1)" stroke="#22d3ee" stroke-width="1.1"/>
      <path d="M7.2 12.4h2.3l1.3-2.6 1.6 4.8 1.2-2.2h2.3" stroke="#0b0f19" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <defs><linearGradient id="g1" x1="4.5" y1="2.5" x2="19.5" y2="21.5" gradientUnits="userSpaceOnUse"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2"/></linearGradient></defs>
    </svg>
    VILIGION
    <span class="tag">Built on Tempo</span>
  </div>
  <div>
    <h1>When the key holder can't say no, <em>someone else gets the call.</em></h1>
    <p class="sub">On-chain treasury monitoring for stablecoins. Critical alerts ring a trusted phone, with no balances or addresses exposed.</p>
  </div>
  <div class="foot"><span class="dot"></span>Phone call + WhatsApp PIN for critical alerts<span class="dot"></span>Email for the rest<span class="dot"></span>Privacy by design</div>
</div>
</body>
</html>
